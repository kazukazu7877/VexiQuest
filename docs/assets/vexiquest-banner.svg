<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#0e0f1e"/>
      <stop offset="100%" stop-color="#07070d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#e2d9c8"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- CRT Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.35"/>
    </pattern>

    <!-- Vintage Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22263d" stroke-width="0.8" opacity="0.4"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Arcade Background -->
  <rect width="1280" height="420" fill="url(#bgGrad)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>

  <!-- CRT Scanlines overlay -->
  <rect width="1280" height="420" fill="url(#scanlines)"/>

  <!-- Ornate Decorative Outer Border -->
  <rect x="24" y="24" width="1232" height="372" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="30" y="30" width="1220" height="360" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Arcade Corner Brackets -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#fbbf24" stroke-width="4"/>
  <path d="M 1260 50 L 1260 20 L 1230 20" fill="none" stroke="#fbbf24" stroke-width="4"/>
  <path d="M 20 370 L 20 400 L 50 400" fill="none" stroke="#fbbf24" stroke-width="4"/>
  <path d="M 1260 370 L 1260 400 L 1230 400" fill="none" stroke="#fbbf24" stroke-width="4"/>

  <!-- Top Retro Badge -->
  <g transform="translate(640, 68)">
    <rect x="-140" y="-16" width="280" height="32" rx="4" fill="#181a2e" stroke="#f59e0b" stroke-width="1.5"/>
    <text text-anchor="middle" y="5" font-family="'Courier New', monospace, sans-serif" font-size="12" font-weight="900" fill="#fcd34d" letter-spacing="4">
      ★ 1980s RETRO ARCADE EDITION ★
    </text>
  </g>

  <!-- Compass Rose Left -->
  <g transform="translate(160, 210)" stroke="#f59e0b" stroke-opacity="0.6">
    <circle r="72" fill="none" stroke-width="1" stroke-dasharray="3,3"/>
    <circle r="52" fill="none" stroke-width="1.5"/>
    <polygon points="0,-68 10,-12 0,0 -10,-12" fill="#fbbf24"/>
    <polygon points="0,68 10,12 0,0 -10,12" fill="#d97706"/>
    <polygon points="-68,0 -12,-10 0,0 -12,10" fill="#b45309"/>
    <polygon points="68,0 12,-10 0,0 12,10" fill="#f59e0b"/>
    <circle r="6" fill="#0e0f1e" stroke="#fbbf24" stroke-width="2"/>
    <text x="0" y="-76" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#fcd34d">N</text>
  </g>

  <!-- Main Game Title: VEXIQUEST -->
  <g transform="translate(640, 175)">
    <!-- Shadow for 3D retro depth -->
    <text text-anchor="middle" y="8" font-family="'Trebuchet MS', 'Impact', sans-serif" font-size="74" font-weight="900" fill="#000000" letter-spacing="12" opacity="0.8">
      VEXIQUEST
    </text>
    <text text-anchor="middle" y="4" font-family="'Trebuchet MS', 'Impact', sans-serif" font-size="74" font-weight="900" fill="#78350f" letter-spacing="12">
      VEXIQUEST
    </text>
    <text text-anchor="middle" y="0" font-family="'Trebuchet MS', 'Impact', sans-serif" font-size="74" font-weight="900" fill="url(#goldGrad)" letter-spacing="12" filter="url(#goldGlow)">
      VEXIQUEST
    </text>
  </g>

  <!-- Tagline Banner -->
  <g transform="translate(640, 235)">
    <text text-anchor="middle" font-family="'Georgia', serif" font-style="italic" font-size="21" fill="url(#parchmentGrad)" letter-spacing="2">
      "195 nations. One curious mind."
    </text>
  </g>

  <!-- Subtitle / Genre description -->
  <g transform="translate(640, 275)">
    <text text-anchor="middle" font-family="'Courier New', monospace, sans-serif" font-size="13" font-weight="bold" fill="#94a3b8" letter-spacing="3">
      VEXILLOLOGY EXPLORATION × RETRO ARCADE GAUNTLET
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(640, 335)">
    <!-- Pill 1: 195 Flags -->
    <g transform="translate(-320, 0)">
      <rect x="-75" y="-15" width="150" height="30" rx="15" fill="#1e2238" stroke="#38bdf8" stroke-width="1.2"/>
      <text text-anchor="middle" y="5" font-family="monospace" font-size="11" font-weight="bold" fill="#e0f2fe" letter-spacing="1">195 COUNTRIES</text>
    </g>

    <!-- Pill 2: 3 Difficulty Modes -->
    <g transform="translate(-105, 0)">
      <rect x="-80" y="-15" width="160" height="30" rx="15" fill="#1e2238" stroke="#fbbf24" stroke-width="1.2"/>
      <text text-anchor="middle" y="5" font-family="monospace" font-size="11" font-weight="bold" fill="#fef3c7" letter-spacing="1">3 DIFFICULTY TIERS</text>
    </g>

    <!-- Pill 3: Interactive Globe -->
    <g transform="translate(110, 0)">
      <rect x="-85" y="-15" width="170" height="30" rx="15" fill="#1e2238" stroke="#34d399" stroke-width="1.2"/>
      <text text-anchor="middle" y="5" font-family="monospace" font-size="11" font-weight="bold" fill="#d1fae5" letter-spacing="1">INTERACTIVE GLOBE</text>
    </g>

    <!-- Pill 4: Procedural Chiptune -->
    <g transform="translate(325, 0)">
      <rect x="-80" y="-15" width="160" height="30" rx="15" fill="#1e2238" stroke="#f472b6" stroke-width="1.2"/>
      <text text-anchor="middle" y="5" font-family="monospace" font-size="11" font-weight="bold" fill="#fce7f3" letter-spacing="1">RETRO CHIPTUNE</text>
    </g>
  </g>

  <!-- Decorative Astrolabe / Coordinate dial Right -->
  <g transform="translate(1120, 210)" stroke="#38bdf8" stroke-opacity="0.5">
    <circle r="72" fill="none" stroke-width="1" stroke-dasharray="2,4"/>
    <circle r="52" fill="none" stroke-width="1.5"/>
    <circle r="32" fill="none" stroke-width="1"/>
    <!-- Diagonal crosshairs -->
    <line x1="-65" y1="-65" x2="65" y2="65" stroke-width="1"/>
    <line x1="-65" y1="65" x2="65" y2="-65" stroke-width="1"/>
    <circle r="4" fill="#38bdf8"/>
    <text x="0" y="88" text-anchor="middle" font-family="monospace" font-size="10" fill="#38bdf8" letter-spacing="2">00°N 00°E</text>
  </g>
</svg>
