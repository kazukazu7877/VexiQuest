<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070810"/>
      <stop offset="45%" stop-color="#0f1124"/>
      <stop offset="100%" stop-color="#06060c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#e2d9c8"/>
    </linearGradient>

    <!-- CRT Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.35"/>
    </pattern>

    <!-- Vintage Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22263d" stroke-width="0.8" opacity="0.4"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Arcade Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- CRT Scanlines overlay -->
  <rect width="1280" height="640" fill="url(#scanlines)"/>

  <!-- Ornate Frame -->
  <rect x="32" y="32" width="1216" height="576" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.5"/>
  <rect x="42" y="42" width="1196" height="556" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Arcade Corner Brackets -->
  <path d="M 24 64 L 24 24 L 64 24" fill="none" stroke="#fbbf24" stroke-width="5"/>
  <path d="M 1256 64 L 1256 24 L 1216 24" fill="none" stroke="#fbbf24" stroke-width="5"/>
  <path d="M 24 576 L 24 616 L 64 616" fill="none" stroke="#fbbf24" stroke-width="5"/>
  <path d="M 1256 576 L 1256 616 L 1216 616" fill="none" stroke="#fbbf24" stroke-width="5"/>

  <!-- Retro Badge Header -->
  <g transform="translate(640, 110)">
    <rect x="-180" y="-18" width="360" height="36" rx="6" fill="#181a2e" stroke="#f59e0b" stroke-width="1.5"/>
    <text text-anchor="middle" y="6" font-family="'Courier New', monospace, sans-serif" font-size="14" font-weight="900" fill="#fcd34d" letter-spacing="4">
      ★ VEXILLOLOGY ARCADE EXPEDITION ★
    </text>
  </g>

  <!-- Compass Rose -->
  <g transform="translate(180, 320)" stroke="#f59e0b" stroke-opacity="0.7">
    <circle r="96" fill="none" stroke-width="1" stroke-dasharray="4,4"/>
    <circle r="72" fill="none" stroke-width="2"/>
    <polygon points="0,-92 14,-16 0,0 -14,-16" fill="#fbbf24"/>
    <polygon points="0,92 14,16 0,0 -14,16" fill="#d97706"/>
    <polygon points="-92,0 -16,-14 0,0 -16,14" fill="#b45309"/>
    <polygon points="92,0 16,-14 0,0 16,14" fill="#f59e0b"/>
    <circle r="8" fill="#0e0f1e" stroke="#fbbf24" stroke-width="2"/>
    <text x="0" y="-102" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#fcd34d">N</text>
  </g>

  <!-- Center Title & Hero Typography -->
  <g transform="translate(640, 245)">
    <text text-anchor="middle" y="10" font-family="'Trebuchet MS', 'Impact', sans-serif" font-size="94" font-weight="900" fill="#000000" letter-spacing="14" opacity="0.8">
      VEXIQUEST
    </text>
    <text text-anchor="middle" y="5" font-family="'Trebuchet MS', 'Impact', sans-serif" font-size="94" font-weight="900" fill="#78350f" letter-spacing="14">
      VEXIQUEST
    </text>
    <text text-anchor="middle" y="0" font-family="'Trebuchet MS', 'Impact', sans-serif" font-size="94" font-weight="900" fill="url(#goldGrad)" letter-spacing="14" filter="url(#goldGlow)">
      VEXIQUEST
    </text>
  </g>

  <!-- Tagline -->
  <g transform="translate(640, 320)">
    <text text-anchor="middle" font-family="'Georgia', serif" font-style="italic" font-size="28" fill="url(#parchmentGrad)" letter-spacing="2">
      "195 nations. One curious mind."
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(640, 370)">
    <text text-anchor="middle" font-family="'Courier New', monospace, sans-serif" font-size="16" font-weight="bold" fill="#94a3b8" letter-spacing="4">
      A RETRO ARCADE GAUNTLET × TREASURE MAP EXPLORATION
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(640, 445)">
    <!-- Pill 1 -->
    <g transform="translate(-330, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e2238" stroke="#38bdf8" stroke-width="1.5"/>
      <text text-anchor="middle" y="6" font-family="monospace" font-size="13" font-weight="bold" fill="#e0f2fe" letter-spacing="1.5">195 COUNTRIES</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-110, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1e2238" stroke="#fbbf24" stroke-width="1.5"/>
      <text text-anchor="middle" y="6" font-family="monospace" font-size="13" font-weight="bold" fill="#fef3c7" letter-spacing="1.5">3 DIFFICULTY TIERS</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(115, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#1e2238" stroke="#34d399" stroke-width="1.5"/>
      <text text-anchor="middle" y="6" font-family="monospace" font-size="13" font-weight="bold" fill="#d1fae5" letter-spacing="1.5">INTERACTIVE GLOBE</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(335, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e2238" stroke="#f472b6" stroke-width="1.5"/>
      <text text-anchor="middle" y="6" font-family="monospace" font-size="13" font-weight="bold" fill="#fce7f3" letter-spacing="1.5">PROCEDURAL AUDIO</text>
    </g>
  </g>

  <!-- Live Deployment Link Footer -->
  <g transform="translate(640, 520)">
    <rect x="-180" y="-18" width="360" height="36" rx="6" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text text-anchor="middle" y="6" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#ccfbf1" letter-spacing="2">
      PLAY ONLINE ➔ vexiquest.vercel.app
    </text>
  </g>

  <!-- Right Astrolabe Dial -->
  <g transform="translate(1100, 320)" stroke="#38bdf8" stroke-opacity="0.6">
    <circle r="96" fill="none" stroke-width="1" stroke-dasharray="3,5"/>
    <circle r="72" fill="none" stroke-width="2"/>
    <circle r="44" fill="none" stroke-width="1"/>
    <line x1="-90" y1="-90" x2="90" y2="90" stroke-width="1.2"/>
    <line x1="-90" y1="90" x2="90" y2="-90" stroke-width="1.2"/>
    <circle r="6" fill="#38bdf8"/>
    <text x="0" y="118" text-anchor="middle" font-family="monospace" font-size="12" fill="#38bdf8" letter-spacing="3">00°N 00°E</text>
  </g>
</svg>
